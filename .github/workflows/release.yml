# Builds core library, thesis and RFC drafts for every version tag (v<major>.<minor>.<patch>[-suffix])
# and publishes them as a GitHub release:
#   - commit part of main          -> full release ("latest"); with a -suffix it stays a pre-release
#   - commit only part of development -> pre-release
#   - neither                       -> nothing is built
# A manual run (workflow_dispatch) builds everything without publishing a release.

name: Release build

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check tag and branch
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      channel: ${{ steps.check.outputs.channel }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not a version tag (expected v<major>.<minor>.<patch>[-suffix])"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          # main wins if the commit is part of both branches
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            channel=main
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/development; then
            channel=development
          else
            channel=none
            echo "::notice::Commit $GITHUB_SHA is neither part of main nor of development - nothing to build"
          fi
          build=$([[ "$channel" != none ]] && echo true || echo false)
          prerelease=$([[ "$channel" == development || "$version" == *-* ]] && echo true || echo false)
          {
            echo "version=$version"
            echo "build=$build"
            echo "channel=$channel"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Version: \`$version\`, branch: \`$channel\`, pre-release: \`$prerelease\`" >> "$GITHUB_STEP_SUMMARY"

  core:
    name: Core library
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set version from tag
        working-directory: application-core-library
        run: >
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set
          -DnewVersion="$VERSION" -DgenerateBackupPoms=false

      - name: Build and test
        run: mvn -B -ntp -pl application-core-library clean package

      - name: Collect artifacts
        run: |
          t=application-core-library/target
          mkdir -p dist
          cp "$t/MessageVortex-core.jar"                  "dist/MessageVortex-$VERSION.jar"
          cp "$t/MessageVortex-jar-with-dependencies.jar" "dist/MessageVortex-$VERSION-all.jar"
          cp "$t/MessageVortex-javadoc.jar"               "dist/MessageVortex-$VERSION-javadoc.jar"
          cp "$t/MessageVortex-package.jar"               "dist/MessageVortex-$VERSION-installer.jar"
          cp "$t/books/adminGuide.pdf"                    "dist/MessageVortex-$VERSION-adminGuide.pdf"

      - uses: actions/upload-artifact@v4
        with:
          name: core
          path: dist/
          if-no-files-found: error

  rfc:
    name: RFC drafts
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-venv calibre ghostscript libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-core fonts-noto-mono
          # the pdf extra pins the matching weasyprint version
          python3 -m venv "$RUNNER_TEMP/x2r"
          "$RUNNER_TEMP/x2r/bin/pip" install 'xml2rfc[pdf]==3.35.0'

      - name: Build RFC drafts
        run: |
          mkdir -p "$RUNNER_TEMP/x2r-cache"
          make -C rfc XML2RFC="$RUNNER_TEMP/x2r/bin/xml2rfc" X2R_OPTS="-N --cache=$RUNNER_TEMP/x2r-cache"

      - uses: actions/upload-artifact@v4
        with:
          name: rfc
          path: rfc/target/xml2rfc/
          if-no-files-found: error

  thesis:
    name: Thesis
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            make texlive-latex-base texlive-latex-recommended texlive-extra-utils texlive-latex-extra \
            texlive-publishers texlive-fonts-recommended texlive-fonts-extra texlive-bibtex-extra \
            texlive-luatex texlive-lang-german texlive-lang-english texlive-science cm-super biber

      - name: Build thesis
        run: make -C thesis

      - uses: actions/upload-artifact@v4
        with:
          name: thesis
          path: thesis/target/main/latex/*.pdf
          if-no-files-found: error

  release:
    name: Publish release
    needs: [ check, core, rfc, thesis ]
    if: github.ref_type == 'tag' && needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.check.outputs.channel }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          ls -la dist
          title="MessageVortex ${GITHUB_REF_NAME}"
          if [[ "$PRERELEASE" == true ]]; then
            flags=(--prerelease --latest=false)
            [[ "$CHANNEL" == development ]] && title="$title (development)"
          else
            flags=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$title" "${flags[@]}"
